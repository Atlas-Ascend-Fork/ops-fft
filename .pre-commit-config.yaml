minimum_pre_commit_version: 4.0.0
default_stages: [pre-commit]
repos:
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: fft-comparison-host-tests
        name: FFT comparison Host tests
        entry: python -m pytest -q tests/host tests/python
        language: python
        additional_dependencies:
          - numpy
          - torch==2.8.0+cpu
          - pytest
          - --extra-index-url=https://download.pytorch.org/whl/cpu
        pass_filenames: false
        files: ^(src/.*/(compare_data|test_helper)\.py|tests/(host|python)/.*\.py)$
